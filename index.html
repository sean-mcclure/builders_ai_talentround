<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentRound</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js"></script>
    <script src="config.js"></script>
    <script src='https://cdn.plot.ly/plotly-3.0.1.min.js'></script>
</head>
<body>
    <div id="top_banner">
        <img id="banner_logo" src="img/logo .webp">
        <button id="top_banner_button_1" class="top_banner_buttons">APPLY</button>
        <button id="top_banner_button_2"  class="top_banner_buttons">SCREENING</button>
        <button id="top_banner_button_3" class="top_banner_buttons">SHORTLISTING</button>
        <button id="top_banner_button_4" class="top_banner_buttons">ASSESSMENT</button>
        <button id="top_banner_button_5" class="top_banner_buttons">INTERVIEWING</button>
        <button id="top_banner_button_6" class="top_banner_buttons">FEEDBACK</button>
        <button id="top_banner_button_7" class="top_banner_buttons">REFERENCES</button>
        <button id="top_banner_button_8" class="top_banner_buttons">OFFER</button>
        <button id="top_banner_button_9" class="top_banner_buttons">ONBOARDING</button>
        <img id="menu" src="img/icons/menu.svg">
    </div>

    <div id="area_wrapper">
          <div id="area_item_1">Geoff Sanders</div>
          <div id="area_item_2">
             <div id="inner_wrapper">
                <div id="inner_item_1"></div>
                <div id="inner_item_2">
                    <div id="visual_wrapper">
                        <div id="visual_item_1">
                            <div id="visual_plot_1"></div>
                        </div>
                        <div id="visual_item_2">
                            <div id="visual_plot_2"></div>
                        </div>
                        <div id="visual_item_3">
                            <div id="visual_plot_3"></div>
                        </div>
                        <div id="visual_item_4">
                            <div id="visual_plot_4"></div>
                        </div>
                    </div>
                </div>
             </div>
          </div>
    </div>

    <div id="side_menu">
        <span id="close_side_menu">X</span>

    </div>

</body>
</html>

<script>

    window.onload = function() {
        main.side_menu.attach_events();
        ["visual_plot_1", "visual_plot_2", "visual_plot_3", "visual_plot_4"].forEach(function(id) {
            main.charts.polar({
                target_id : id   
            });
        });  
    }
    
</script>
